# Content manager config (Sveltia CMS, Decap compatible) for the blog and the docs.
# Served at /admin/config.yml. __REPO__, __BRANCH__ and __SITE_URL__ are filled in at build time
# from src/data/site.json and the site URL by src/pages/admin/config.yml.ts.

backend:
  name: github
  repo: __REPO__
  branch: __BRANCH__

# Posts and pages go live as soon as someone publishes them (a commit to the branch above).
# To review changes first, uncomment this: drafts become pull requests until someone approves.
# publish_mode: editorial_workflow

site_url: __SITE_URL__
locale: en

media_folder: public/assets/uploads
public_folder: /assets/uploads

collections:
  # ── Blog ────────────────────────────────────────────────────────────────
  - name: blog
    label: Blog posts
    label_singular: Blog post
    folder: src/content/blog
    extension: mdx
    format: frontmatter
    create: true
    slug: "{{slug}}"
    preview_path: "blog/{{slug}}/"
    summary: "{{title}}"
    sortable_fields: [date, title, author]
    fields:
      - { label: Title, name: title, widget: string }
      - label: Publish date
        name: date
        widget: datetime
        date_format: YYYY-MM-DD
        time_format: false
        format: YYYY-MM-DD
      - { label: Author, name: author, widget: string, default: MonoPanel }
      - { label: Author GitHub username, name: authorGithub, widget: string, required: false, hint: "Shows the author's GitHub avatar and link. Leave empty for none." }
      - { label: Pin to the top, name: pinned, widget: boolean, default: false, required: false }
      - label: Body
        name: body
        widget: markdown
        hint: "Plain Markdown. Put anything with < or { in `backticks` or a code block, or the site build fails (these are MDX files)."

  # ── Docs: one collection per folder. The sidebar groups pages by Section, not by folder. ──
  - name: docs_features
    label: "Docs · Features"
    label_singular: Docs page
    folder: src/content/docs/features
    extension: mdx
    format: frontmatter
    create: true
    slug: "{{slug}}"
    preview_path: "docs/features/{{slug}}/"
    summary: "{{order}} · {{title}}"
    sortable_fields: [order, title]
    fields:
      - &f_title { label: Title, name: title, widget: string }
      - &f_desc { label: Description, name: description, widget: string, hint: "One sentence shown under the title and in search results." }
      - { label: Section, name: section, widget: select, default: Features, options: &sections [Project, Features, Administration, API, Panel, Configuration, Development, Architecture, Daemon], hint: "Which group of the docs sidebar the page appears in." }
      - &f_order { label: Sidebar order, name: order, widget: number, value_type: int, min: 0, hint: "Pages sort by this number. Features use 10-29, Administration 30-39, API 40-45, Panel 46-49, Configuration 50-59, Development 60-69, Architecture 70-79, Daemon 80-99." }
      - &f_author { label: Author, name: author, widget: string, required: false }
      - &f_date { label: Last updated, name: date, widget: datetime, date_format: YYYY-MM-DD, time_format: false, format: YYYY-MM-DD, required: false }
      - &f_body { label: Body, name: body, widget: markdown, hint: "Plain Markdown. Put anything with < or { in `backticks` or a code block, or the site build fails (these are MDX files)." }

  - name: docs_admin
    label: "Docs · Administration"
    label_singular: Docs page
    folder: src/content/docs/admin
    extension: mdx
    format: frontmatter
    create: true
    slug: "{{slug}}"
    preview_path: "docs/admin/{{slug}}/"
    summary: "{{order}} · {{title}}"
    sortable_fields: [order, title]
    fields:
      - *f_title
      - *f_desc
      - { label: Section, name: section, widget: select, default: Administration, options: *sections }
      - *f_order
      - *f_author
      - *f_date
      - *f_body

  - name: docs_api
    label: "Docs · API"
    label_singular: Docs page
    folder: src/content/docs/api
    extension: mdx
    format: frontmatter
    create: true
    slug: "{{slug}}"
    preview_path: "docs/api/{{slug}}/"
    summary: "{{order}} · {{title}}"
    sortable_fields: [order, title]
    fields:
      - *f_title
      - *f_desc
      - { label: Section, name: section, widget: select, default: API, options: *sections }
      - *f_order
      - *f_author
      - *f_date
      - *f_body

  - name: docs_panel
    label: "Docs · Panel"
    label_singular: Docs page
    folder: src/content/docs/panel
    extension: mdx
    format: frontmatter
    create: true
    slug: "{{slug}}"
    preview_path: "docs/panel/{{slug}}/"
    summary: "{{order}} · {{title}}"
    sortable_fields: [order, title]
    fields:
      - *f_title
      - *f_desc
      - { label: Section, name: section, widget: select, default: Panel, options: *sections }
      - *f_order
      - *f_author
      - *f_date
      - *f_body

  - name: docs_configuration
    label: "Docs · Configuration"
    label_singular: Docs page
    folder: src/content/docs/configuration
    extension: mdx
    format: frontmatter
    create: true
    slug: "{{slug}}"
    preview_path: "docs/configuration/{{slug}}/"
    summary: "{{order}} · {{title}}"
    sortable_fields: [order, title]
    fields:
      - *f_title
      - *f_desc
      - { label: Section, name: section, widget: select, default: Configuration, options: *sections }
      - *f_order
      - *f_author
      - *f_date
      - *f_body

  - name: docs_development
    label: "Docs · Development"
    label_singular: Docs page
    folder: src/content/docs/development
    extension: mdx
    format: frontmatter
    create: true
    slug: "{{slug}}"
    preview_path: "docs/development/{{slug}}/"
    summary: "{{order}} · {{title}}"
    sortable_fields: [order, title]
    fields:
      - *f_title
      - *f_desc
      - { label: Section, name: section, widget: select, default: Development, options: *sections }
      - *f_order
      - *f_author
      - *f_date
      - *f_body

  - name: docs_daemon
    label: "Docs · Daemon"
    label_singular: Docs page
    folder: src/content/docs/daemon
    extension: mdx
    format: frontmatter
    create: true
    slug: "{{slug}}"
    preview_path: "docs/daemon/{{slug}}/"
    summary: "{{order}} · {{title}}"
    sortable_fields: [order, title]
    fields:
      - *f_title
      - *f_desc
      - { label: Section, name: section, widget: select, default: Daemon, options: *sections }
      - *f_order
      - *f_author
      - *f_date
      - *f_body

  # The two pages that sit at the top of the docs folder (edit only; add new pages in a folder above).
  - name: docs_top
    label: "Docs · Overview pages"
    files:
      - label: About
        name: about
        file: src/content/docs/about.mdx
        format: frontmatter
        preview_path: "docs/about/"
        fields:
          - *f_title
          - *f_desc
          - { label: Section, name: section, widget: select, default: Project, options: *sections }
          - *f_order
          - *f_author
          - *f_date
          - *f_body
      - label: Architecture
        name: architecture
        file: src/content/docs/architecture.mdx
        format: frontmatter
        preview_path: "docs/architecture/"
        fields:
          - *f_title
          - *f_desc
          - { label: Section, name: section, widget: select, default: Architecture, options: *sections }
          - *f_order
          - *f_author
          - *f_date
          - *f_body
